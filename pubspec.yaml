name: player_m3u8
description: Texture-based Flutter HLS/m3u8 player for iOS and Android with playback controls, events, playlist switching, and disk prefetch progress.
version: 0.1.4
homepage: https://github.com/yanmingLiu/player_m3u8
repository: https://github.com/yanmingLiu/player_m3u8
issue_tracker: https://github.com/yanmingLiu/player_m3u8/issues
topics:
  - hls
  - m3u8
  - video-player
  - flutter-plugin
  - exoplayer

platforms:
  android:
  ios:

environment:
  sdk: ^3.10.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ai3.player_m3u8.player_m3u8
        pluginClass: PlayerM3u8Plugin
      ios:
        pluginClass: PlayerM3u8Plugin
